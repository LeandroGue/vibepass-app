<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <meta name="theme-color" content="#97472a">
    <title>VibePass - Ayuda y Soporte</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#fdf9ee", surface: "#fdf9ee",
                        primary: "#97472a", "primary-container": "#ff9a76",
                        "on-surface": "#1c1c15", "on-surface-variant": "#55433d",
                        outline: "#88726c", "outline-variant": "#dbc1b9"
                    },
                    fontFamily: { headline: ["Plus Jakarta Sans", "sans-serif"], caps: ["Plus Jakarta Sans", "sans-serif"] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased bg-[#fdf9ee] content-ready">

    <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 bg-surface shadow-sm">
        <div class="flex items-center gap-2 text-primary">
            <span class="material-symbols-outlined text-[26px]">confirmation_number</span>
            <span class="font-headline text-lg font-black tracking-tight uppercase">VIBEPASS</span>
        </div>
        <button onclick="window.location.href='coleccion.html'" class="text-on-surface-variant hover:text-on-surface p-1 transition-colors">
            <span class="material-symbols-outlined text-[26px]">style</span>
        </button>
    </header>

    <div class="main-content pt-20 pb-[120px] px-6 max-w-[600px] mx-auto flex flex-col gap-6">
        <h2 class="font-headline text-2xl font-black text-primary uppercase">Centro de Ayuda</h2>

        <div class="bg-surface-container rounded-2xl p-5 border border-outline-variant/30 flex flex-col gap-4">
            <div class="flex items-center gap-3 border-b border-outline-variant/20 pb-4">
                <span class="material-symbols-outlined text-primary text-3xl">contact_support</span>
                <div>
                    <h3 class="font-bold text-on-surface">¿Dudas o Sugerencias?</h3>
                    <p class="text-xs text-on-surface-variant">Escríbenos directamente.</p>
                </div>
            </div>
            <a href="mailto:leemguepe@gmail.com" class="w-full bg-primary text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all">
                <span class="material-symbols-outlined">mail</span> Enviar Correo
            </a>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <button onclick="restartTutorial()" class="bg-white p-5 rounded-2xl border border-outline-variant/30 flex items-center justify-between active:scale-[0.98] transition-all shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center text-secondary"><span class="material-symbols-outlined">school</span></div>
                    <div class="text-left">
                        <h4 class="font-bold text-on-surface">Ver Tutorial</h4>
                        <p class="text-[10px] text-on-surface-variant font-medium">Aprende a usar VibePass de nuevo.</p>
                    </div>
                </div>
                <span class="material-symbols-outlined text-outline-variant">chevron_right</span>
            </button>

            <button onclick="window.open('https://play.google.com/store/apps/details?id=com.vibepass.app', '_blank')" class="bg-white p-5 rounded-2xl border border-outline-variant/30 flex items-center justify-between active:scale-[0.98] transition-all shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center text-primary"><span class="material-symbols-outlined">update</span></div>
                    <div class="text-left">
                        <h4 class="font-bold text-on-surface">Buscar Actualización</h4>
                        <p class="text-[10px] text-on-surface-variant font-medium">Asegúrate de tener la última versión.</p>
                    </div>
                </div>
                <span class="material-symbols-outlined text-outline-variant">chevron_right</span>
            </button>
        </div>

        <div class="mt-4 flex flex-col items-center gap-2 py-6 border-t border-outline-variant/20">
            <p class="text-[10px] font-caps tracking-widest text-on-surface-variant font-bold uppercase">VIBEPASS v1.9.0</p>
            <p class="text-[9px] text-on-surface-variant/60 font-medium">Hecho con ❤️ para momentos especiales</p>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 bg-surface-container-low/95 backdrop-blur-2xl border-t-2 border-outline-variant/30 shadow-lg rounded-t-3xl pt-3 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))]">
        <button id="navBtn-home" onclick="window.location.href='index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span class="material-symbols-outlined text-2xl">explore</span><span class="font-caps text-[10px] font-bold mt-1">Explorar</span></button>
        <button id="navBtn-roulette" onclick="window.location.href='ruleta.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span class="material-symbols-outlined text-2xl">casino</span><span class="font-caps text-[10px] font-bold mt-1">Ruleta</span></button>
        <button id="navBtn-saved" onclick="window.location.href='coleccion.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span class="material-symbols-outlined text-2xl">style</span><span class="font-caps text-[10px] font-bold mt-1">Colección</span></button>
        <button id="navBtn-help" onclick="window.location.href='ayuda.html'" class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-full px-4 py-2 transition-all scale-105 shadow-sm"><span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">info</span><span class="font-caps text-[10px] font-black mt-1">Ayuda</span></button>
    </nav>

    <div id="toast" class="toast fixed bottom-24 left-1/2 -translate-x-1/2 bg-surface-container-high border border-outline-variant text-on-surface py-3 px-6 rounded-full font-caps text-xs font-bold z-[2000] opacity-0 pointer-events-none transition-all duration-300"></div>

    <script src="js/onboarding.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
