<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <meta name="theme-color" content="#97472a">
    <title>VibePass - Ruleta</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">

    <style>
        body { background-color: #fdf9ee; }
        .screen { display: none; }
        .screen.active { display: flex; }
    </style>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#fdf9ee", surface: "#fdf9ee",
                        "surface-container-low": "#f7f3e8", "surface-container": "#f1eee3",
                        "surface-container-high": "#ece8dd", "surface-container-highest": "#e6e2d8",
                        "surface-container-lowest": "#ffffff",
                        primary: "#97472a", "primary-container": "#ff9a76",
                        "on-surface": "#1c1c15", "on-surface-variant": "#55433d",
                        outline: "#88726c", "outline-variant": "#dbc1b9",
                        error: "#ba1a1a", "on-primary": "#ffffff", "on-primary-container": "#380c00"
                    },
                    fontFamily: { headline: ["Plus Jakarta Sans", "sans-serif"], caps: ["Plus Jakarta Sans", "sans-serif"] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased bg-[#fdf9ee] content-ready">

    <!-- Header UNIFICADO con Escáner y Colección -->
    <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 bg-surface shadow-sm">
        <div class="flex items-center gap-2 text-primary">
            <span class="material-symbols-outlined text-[26px]">confirmation_number</span>
            <span class="font-headline text-lg font-black tracking-tight uppercase">VIBEPASS</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="startScanning()" class="text-primary hover:text-primary-container p-2 transition-all active:scale-90 flex items-center justify-center">
                <span class="material-symbols-outlined text-[28px]">qr_code_scanner</span>
            </button>
            <button onclick="window.location.href='coleccion.html'" class="text-on-surface-variant hover:text-on-surface p-1 transition-colors">
                <span class="material-symbols-outlined text-[26px]">style</span>
            </button>
        </div>
    </header>

    <div class="main-content pt-20 pb-[120px] px-6 max-w-[600px] mx-auto flex flex-col gap-6">

        <!-- PANTALLA: RULETA -->
        <div id="screen-roulette" class="screen active flex flex-col gap-6">
            <div class="mt-2"><h2 class="font-headline text-xl font-bold text-on-surface">Ruleta de Favores</h2></div>
            <div class="flex flex-col items-center gap-8 py-4 relative">
                <div class="text-3xl z-20">🔻</div>
                <div id="rouletteWheel" class="w-[280px] h-[280px] rounded-full border-8 border-surface-container-high shadow-xl relative"></div>
                <button id="spinBtn" onclick="spinRoulette()" class="bg-primary text-white font-headline font-bold text-sm uppercase px-10 py-4 rounded-full shadow-md active:scale-95 transition-all">🎯 Girar Ruleta</button>
            </div>
            <div id="rouletteResult" class="hidden bg-surface-container rounded-2xl p-5 flex flex-col items-center gap-3 text-center border border-outline-variant/30">
                <span id="resultEmoji" class="text-5xl"></span>
                <h3 id="resultText" class="font-headline text-lg font-bold text-on-surface mt-1"></h3>
                <button onclick="useRouletteResult()" class="bg-primary-container text-on-primary-container font-headline font-bold text-xs uppercase px-6 py-2.5 rounded-full flex items-center gap-1 shadow-sm active:scale-95 transition-transform">Personalizar <span class="material-symbols-outlined text-sm">arrow_forward</span></button>
            </div>
            <div class="mt-10 py-6 border-t border-outline-variant/20 flex flex-col items-center gap-2">
                <p onclick="handleDebugTap()" class="text-[10px] font-caps tracking-widest text-on-surface-variant font-bold select-none cursor-default uppercase">VIBEPASS v1.8.3</p>
                <a href="https://leandrogue.github.io/vibepass-app/privacy-policy.html" target="_blank" class="text-[9px] text-primary font-bold underline">Política de Privacidad</a>
            </div>
        </div>

        <!-- PANTALLA: EDITOR (Sincronizado con index.html) -->
        <div id="screen-generator" class="screen hidden flex flex-col gap-6">
            <div class="flex items-center gap-3">
                <button onclick="goBack()" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface border border-outline-variant/50 text-on-surface shadow-sm active:scale-90 transition-transform"><span class="material-symbols-outlined">arrow_back</span></button>
                <h2 class="font-headline text-lg font-bold text-on-surface">Personalizar Pase</h2>
            </div>
            <div class="flex justify-center py-2 relative">
                <div id="interactiveCard" class="w-full max-w-[320px] rounded-2xl border-2 border-outline-variant bg-surface-container-lowest flex flex-col overflow-hidden shadow-xl relative transition-all duration-300">
                    <div id="editorCardHeader" class="bg-primary-container p-4 flex justify-between items-center transition-colors duration-300 border-b-2 border-outline-variant/30 ticket-cutout pb-8">
                        <span id="editorCardHeaderLabel" class="font-headline text-sm font-black tracking-widest uppercase text-on-primary-container">COLECCIÓN DE FAVORES</span>
                        <span class="material-symbols-outlined text-on-primary-container text-[28px]">verified</span>
                    </div>
                    <div class="p-6 bg-surface-container-low flex flex-col gap-4 relative min-h-[220px]">
                        <div class="perforated-line"></div>
                        <div id="cardStickersContainer" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>
                        <div id="avatarContainer" class="w-16 h-16 rounded-full bg-surface-container mx-auto border-2 border-outline-variant flex items-center justify-center relative z-10 transition-colors"><span class="material-symbols-outlined text-[36px] text-on-surface-variant" id="avatarIcon">face</span></div>
                        <div class="text-center z-10 space-y-1">
                            <p class="font-caps text-[8px] text-primary tracking-[0.2em] font-bold uppercase" id="passBadgeLabel">PASE ESPECIAL</p>
                            <h3 id="previewPassTitle" class="font-headline text-md font-bold text-on-surface leading-tight px-2 uppercase break-words">Nombre del Pase</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-1 z-10">
                            <div class="bg-surface-container-lowest p-2.5 rounded-xl border border-outline-variant/30 text-left"><span class="font-caps text-[8px] text-on-surface-variant block uppercase font-bold tracking-wider mb-0.5">FECHA</span><span class="text-[10px] text-on-surface font-bold truncate" id="previewExpiryText">CUALQUIER DÍA</span></div>
                            <div class="bg-surface-container-lowest p-2.5 rounded-xl border border-outline-variant/30 text-left"><span class="font-caps text-[8px] text-on-surface-variant block uppercase font-bold tracking-wider mb-0.5">VIBE</span><span class="text-[10px] text-on-surface font-bold truncate" id="previewVibeText">FAMILIAR</span></div>
                        </div>
                        <div class="bg-white p-2 rounded-xl flex justify-center items-center mt-2 z-10 w-20 h-20 mx-auto border border-outline-variant/30"><span class="material-symbols-outlined text-outline-variant text-[44px]">qr_code_2</span></div>
                    </div>
                </div>
            </div>
            <div class="bg-surface-container rounded-2xl p-5 flex flex-col gap-4 border border-outline-variant/30">
                <div class="flex border-b border-outline-variant/30 pb-2 gap-1">
                    <button id="tabBtnText" onclick="switchEditorTab('text')" class="flex-1 pb-2 font-caps text-[10px] font-bold text-primary border-b-2 border-primary text-center">TEXTO</button>
                    <button id="tabBtnIcon" onclick="switchEditorTab('icon')" class="flex-1 pb-2 font-caps text-[10px] font-bold text-on-surface-variant hover:text-on-surface text-center hidden">ICONO</button>
                    <button id="tabBtnColor" onclick="switchEditorTab('color')" class="flex-1 pb-2 font-caps text-[10px] font-bold text-on-surface-variant hover:text-on-surface text-center">COLOR</button>
                    <button id="tabBtnStickers" onclick="switchEditorTab('stickers')" class="flex-1 pb-2 font-caps text-[10px] font-bold text-on-surface-variant hover:text-on-surface text-center">STICKERS</button>
                </div>
                <div id="editorTabText" class="flex flex-col gap-4">
                    <div id="customTitleContainer" class="flex flex-col gap-1.5 hidden"><label class="font-caps text-[9px] text-on-surface-variant font-bold tracking-widest uppercase">Título</label><input id="inputCustomTitle" type="text" maxlength="30" oninput="updateCustomTitlePreview()" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl py-3 px-4 text-sm font-semibold focus:border-primary focus:outline-none" /></div>
                    <div class="flex flex-col gap-1.5"><label class="font-caps text-[9px] text-on-surface-variant font-bold tracking-widest uppercase">PARA</label><input id="inputName" type="text" maxlength="25" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl py-3 px-4 text-sm font-semibold focus:border-primary focus:outline-none" /></div>
                    <div class="flex flex-col gap-1.5"><label class="font-caps text-[9px] text-on-surface-variant font-bold tracking-widest uppercase">DE (OPCIONAL)</label><input id="inputSender" type="text" maxlength="25" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl py-3 px-4 text-sm font-semibold focus:border-primary focus:outline-none" /></div>
                    <div class="flex flex-col gap-1.5"><label class="font-caps text-[9px] text-on-surface-variant font-bold tracking-widest uppercase">DETALLES (OPCIONAL)</label><textarea id="inputMessage" placeholder="Ej. Incluye café, tostadas y mucho cariño..." maxlength="80" rows="2" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl py-3 px-4 text-sm font-semibold resize-none focus:border-primary focus:outline-none"></textarea></div>
                    <div class="flex flex-col gap-1.5"><label class="font-caps text-[9px] text-on-surface-variant font-bold tracking-widest uppercase">VENCIMIENTO (OPCIONAL)</label><input id="inputExpiry" type="date" oninput="updatePreviewExpiry()" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl py-3 px-4 text-sm font-semibold focus:border-primary focus:outline-none" /></div>
                </div>
                <div id="editorTabIcon" class="hidden flex-col gap-3"><div class="grid grid-cols-6 gap-2" id="emojiGrid"></div></div>
                <div id="editorTabColor" class="hidden flex-col gap-3"><div class="grid grid-cols-4 gap-3" id="themeGrid">
                    <button id="themeBtn-orange" onclick="selectNeonTheme('orange')" class="h-12 rounded-xl bg-[#ff9a76] border-2 border-white ring-2 ring-primary flex items-center justify-center transition-all"></button>
                    <button id="themeBtn-green" onclick="selectNeonTheme('green')" class="h-12 rounded-xl bg-[#ceeaca] border-2 border-white flex items-center justify-center transition-all"></button>
                    <button id="themeBtn-blue" onclick="selectNeonTheme('blue')" class="h-12 rounded-xl bg-[#8cbbcd] border-2 border-white flex items-center justify-center transition-all"></button>
                    <button id="themeBtn-gold" onclick="selectNeonTheme('gold')" class="h-12 rounded-xl bg-[#ffdbcf] border-2 border-white flex items-center justify-center transition-all"></button>
                </div></div>
                <div id="editorTabStickers" class="hidden flex-col gap-3"><div class="grid grid-cols-6 gap-2" id="stickerGrid"></div></div>
            </div>
            <button onclick="generatePass()" class="w-full bg-primary text-white font-headline font-bold text-sm uppercase py-4 rounded-full shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2"><span>Generar VibePass</span><span class="material-symbols-outlined text-lg">bolt</span></button>
        </div>

        <!-- PANTALLA: RESULTADO -->
        <div id="screen-result" class="screen hidden flex flex-col gap-6">
            <div class="flex items-center gap-3">
                <button onclick="showScreen('roulette')" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface border border-outline-variant/50 text-on-surface shadow-sm active:scale-90 transition-transform"><span class="material-symbols-outlined">casino</span></button>
                <h2 class="font-headline text-lg font-bold text-on-surface">¡Pase Confirmado! 🎉</h2>
            </div>
            <div class="flex justify-center w-full" id="passPreview"></div>
            <div class="flex flex-col gap-4">
                <button onclick="window.location.href='coleccion.html'" class="w-full bg-primary text-white font-headline font-bold text-sm py-4 rounded-full uppercase shadow-md active:scale-95 transition-all flex items-center justify-center gap-2"><span class="material-symbols-outlined">style</span> Ver mi Colección</button>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="sharePass()" class="bg-white border border-outline-variant text-on-surface py-3.5 px-3 rounded-full flex flex-col items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-all"><span class="material-symbols-outlined text-secondary text-2xl">share</span><span class="font-caps text-[10px] font-bold uppercase">Compartir</span></button>
                    <button onclick="shareAsSticker()" class="bg-white border border-outline-variant text-on-surface py-3.5 px-3 rounded-full flex flex-col items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-all"><span class="material-symbols-outlined text-primary text-2xl">add_reaction</span><span class="font-caps text-[10px] font-bold uppercase">Sticker</span></button>
                </div>
                <button onclick="downloadPass()" class="w-full bg-white border border-outline-variant text-on-surface py-4 rounded-full flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all"><span class="material-symbols-outlined text-tertiary text-xl">download</span><span class="font-caps text-[10px] font-bold uppercase">Descargar JPG</span></button>
            </div>
        </div>
    </div>

    <!-- Nav UNIFICADA -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 bg-surface-container-low/95 backdrop-blur-2xl border-t-2 border-outline-variant/30 shadow-lg rounded-t-3xl pt-3 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))]">
        <button id="navBtn-home" onclick="window.location.href='index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span class="material-symbols-outlined text-2xl">explore</span><span class="font-caps text-[10px] font-bold mt-1">Explorar</span></button>
        <button id="navBtn-roulette" onclick="window.location.href='ruleta.html'" class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-full px-4 py-2 transition-all scale-105 shadow-sm"><span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">casino</span><span class="font-caps text-[10px] font-black mt-1">Ruleta</span></button>
        <button id="navBtn-saved" onclick="window.location.href='coleccion.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span class="material-symbols-outlined text-2xl">style</span><span class="font-caps text-[10px] font-bold mt-1">Colección</span></button>
        <button id="navBtn-help" onclick="window.location.href='ayuda.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span class="material-symbols-outlined text-2xl">info</span><span class="font-caps text-[10px] font-bold mt-1">Ayuda</span></button>
    </nav>

    <div id="toast" class="toast fixed bottom-24 left-1/2 -translate-x-1/2 bg-surface-container-high border border-outline-variant text-on-surface py-3 px-6 rounded-full font-caps text-xs font-bold z-[2000] opacity-0 pointer-events-none transition-all duration-300"></div>

    <script src="js/passes.js"></script>
    <script src="js/roulette.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
